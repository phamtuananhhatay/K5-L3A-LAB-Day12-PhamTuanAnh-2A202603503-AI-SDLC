<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello 3D</title>
<style>
  body { margin: 0; background: #101827; color: #f8e5a5; font: 16px system-ui; }
  main { max-width: 760px; margin: 32px auto; padding: 0 16px; }
  canvas { width: 100%; aspect-ratio: 16 / 9; display: block; background: #18243b; }
</style>
<main>
  <h1>Hello 3D</h1>
  <p id="status">Đang khởi tạo WebGL2…</p>
  <canvas id="scene" width="960" height="540"></canvas>
</main>
<script type="module">
  const canvas = document.querySelector('#scene');
  const status = document.querySelector('#status');
  const gl = canvas.getContext('webgl2');
  if (!gl) {
    status.textContent = 'Trình duyệt không hỗ trợ WebGL2.';
    throw new Error('WebGL2 unavailable');
  }

  const vertex = `#version 300 es
    in vec3 position;
    uniform float angle;
    void main() {
      float c = cos(angle), s = sin(angle);
      vec3 p = vec3(c * position.x + s * position.z, position.y,
                    -s * position.x + c * position.z);
      p.z -= 4.0;
      gl_Position = vec4(p.x * 1.2, p.y * 1.2, -p.z * 0.7 - 1.0, -p.z);
    }`;
  const fragment = `#version 300 es
    precision mediump float;
    out vec4 color;
    void main() { color = vec4(1.0, 0.68, 0.22, 1.0); }`;
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader));
    }
    return shader;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  // A four-sided 3D pyramid: four triangular sides and a square base.
  const top = [0, 1, 0], a = [-1, -1, 1], b = [1, -1, 1];
  const c = [1, -1, -1], d = [-1, -1, -1];
  const vertices = new Float32Array([
    ...top, ...a, ...b, ...top, ...b, ...c,
    ...top, ...c, ...d, ...top, ...d, ...a,
    ...a, ...d, ...c, ...a, ...c, ...b,
  ]);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 3, gl.FLOAT, false, 0, 0);
  gl.enable(gl.DEPTH_TEST);
  const angle = gl.getUniformLocation(program, 'angle');

  function frame(time) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.09, 0.14, 0.23, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniform1f(angle, time * 0.0006);
    gl.drawArrays(gl.TRIANGLES, 0, vertices.length / 3);
    requestAnimationFrame(frame);
  }
  status.textContent = 'WebGL2 hoạt động: hình chóp 3D đang quay.';
  requestAnimationFrame(frame);
</script>
</html>
