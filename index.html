<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đảo Đèn Lồng — Đêm 1</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #11152b; color: #fff2c8; font: 16px system-ui, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; }
    #hud { position: fixed; top: 18px; left: 18px; min-width: 255px; padding: 15px 18px; border: 1px solid #e7ad6666; border-radius: 14px; background: #12162bc9; backdrop-filter: blur(5px); line-height: 1.5; box-shadow: 0 8px 24px #0005; }
    #hud h1 { font-size: 20px; margin: 0 0 7px; color: #ffd688; }
    #hud strong { color: #ffdc86; }
    #hint { position: fixed; bottom: 17px; left: 50%; transform: translateX(-50%); padding: 9px 14px; border-radius: 8px; background: #12162bd9; text-align: center; white-space: nowrap; font-size: 14px; }
    #message { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; background: #0b1022bd; text-align: center; }
    #message h2 { font-size: 42px; margin: 0; color: #ffdc86; }
    #message p { font-size: 20px; }
    #error { position: fixed; right: 16px; top: 16px; max-width: 430px; background: #611d35; padding: 12px; display: none; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="scene" width="1280" height="720" aria-label="Đảo Đèn Lồng 3D"></canvas>
  <aside id="hud">
    <h1>ĐẢO ĐÈN LỒNG · ĐÊM 1</h1>
    <div>Tim đèn: <strong id="flames">3</strong></div>
    <div>Đom đóm mang theo: <strong id="carried">0</strong> / 5</div>
    <div>Đèn đã thắp: <strong id="lit">0</strong> / 5</div>
    <div>Thời gian: <strong id="time">300</strong> giây</div>
    <div>Điểm: <strong id="score">0</strong></div>
  </aside>
  <div id="hint">WASD di chuyển · Space nhảy · F nạp đèn · Q tỏa sáng · ← → xoay camera · R chơi lại</div>
  <div id="message"><h2 id="result"></h2><p>Nhấn R để chơi lại</p></div>
  <div id="error"></div>
  <script type="module" src="/src/game.mjs"></script>
</body>
</html>
